# ============================================================
# RA1 Universal Docker Compose
# Run everything from the project root with:
#   docker compose up -d
# ============================================================

services:
  # ===================== Canvas Frontend =====================
  canvas:
    build:
      context: ./apps/canvas
      dockerfile: Dockerfile
      target: dev
    container_name: ra1-canvas
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    volumes:
      - ./apps/canvas/src:/app/src
      - ./apps/canvas/public:/app/public
      - ./apps/canvas/index.html:/app/index.html
    networks:
      - ra1-network
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ===================== Infrastructure =====================

  postgres:
    image: postgres:16.3-alpine
    container_name: ra1-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ra1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ra1}
    ports:
      - "5432:5432"
    volumes:
      - ra1-postgres-data:/var/lib/postgresql/data
      - ./services/infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-king-init.sql
      - ./services/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/02-init-multi-db.sh
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ra1} -d ${POSTGRES_DB:-ra1}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7.2.5-alpine
    container_name: ra1-valkey
    command: valkey-server --appendonly yes
    volumes:
      - ra1-valkey-data:/data
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/redis:7
    container_name: ra1-redis
    ports:
      - "6379:6379"
    command: --requirepass ${REDIS_AUTH}
    volumes:
      - ra1-redis-data:/data
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: ra1-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ra1-mongodb-data:/data/db
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: ra1-minio
    ports:
      - "9090:9000"
      - "9091:9001"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ra1-minio-data:/data
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: ra1-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ra1-clickhouse-data:/var/lib/clickhouse
      - ./services/infra/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: ra1-qdrant
    volumes:
      - ra1-qdrant-data:/qdrant/storage
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.3.6
    container_name: ra1-ollama
    volumes:
      - ra1-ollama-data:/root/.ollama
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================== Infisical (Secret Vault) =====================

  infisical-db:
    image: postgres:17
    container_name: ra1-infisical-db
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - ra1-infisical-pgdata:/var/lib/postgresql/data
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  infisical:
    image: infisical/infisical:latest
    container_name: ra1-infisical
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_STRING: postgresql://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      DB_HOST: infisical-db
      DB_PORT: 5432
      DB_NAME: infisical
      DB_USER: infisical
      DB_PASSWORD: ${INFISICAL_DB_PASSWORD}
      REDIS_URL: redis://default:${REDIS_AUTH}@redis:6379
      POSTHOG_HOST: ""
      SITE_URL: http://localhost:8080
      TELEMETRY_ENABLED: "false"
    volumes:
      - ra1-infisical-data:/data
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy

  # ===================== LiteLLM (Model Proxy) =====================

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.44.2
    container_name: ra1-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./services/litellm/config.yaml:/app/config.yaml
    command: ["litellm", "--config", "/app/config.yaml", "--host", "0.0.0.0"]
    environment:
      # Provider API keys are NOT set here.
      # Keys are pushed to LiteLLM at runtime via /model/update
      # when an admin stores them in Infisical (ra1-providers project).
      # See apps/api/src/services/litellm.service.ts → updateModelsForProvider()
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ===================== Langfuse (Observability / ATRS) =====================

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: ra1-langfuse-web
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ra1}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SALT}
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_URL: http://localhost:3002
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
    networks:
      - ra1-network
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: ra1-langfuse-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ra1}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
    networks:
      - ra1-network
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===================== LibreChat (Chat UI) =====================

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: ra1-librechat
    ports:
      - "3080:3080"
    volumes:
      - ./pepper/librechat.yaml:/app/librechat.yaml
      - ra1-librechat-images:/app/client/public/images
    environment:
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      ENDPOINTS: custom
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_SOCIAL_LOGIN: ${ALLOW_SOCIAL_LOGIN:-false}
      LIBRECHAT_APP_SECRET: ${LIBRECHAT_APP_SECRET}
    networks:
      - ra1-network
    depends_on:
      mongodb:
        condition: service_healthy
      litellm:
        condition: service_started


  # ===================== API (Core Engine) =====================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ra1-api
    environment:
      - INFISICAL_URL=${INFISICAL_URL:-http://infisical:8080}
      - INFISICAL_SERVICE_TOKEN=${INFISICAL_SERVICE_TOKEN}
      - INFISICAL_SYSTEM_PROJECT_ID=${INFISICAL_SYSTEM_PROJECT_ID}
      - INFISICAL_PROVIDERS_PROJECT_ID=${INFISICAL_PROVIDERS_PROJECT_ID}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-dev}
      - API_PORT=${API_PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
      # Direct env vars for non-Infisical quick start
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ra1}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ra1}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - VALKEY_URL=redis://valkey:6379
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_URL=http://litellm:4000
      - JWT_SECRET=${JWT_SECRET}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/package.json:/app/apps/api/package.json
      - ./packages:/app/packages
    ports:
      - "3001:3001"
    networks:
      - ra1-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

networks:
  ra1-network:
    driver: bridge

volumes:
  ra1-postgres-data:
  ra1-valkey-data:
  ra1-redis-data:
  ra1-mongodb-data:
  ra1-minio-data:
  ra1-clickhouse-data:
  ra1-qdrant-data:
  ra1-ollama-data:
  ra1-infisical-data:
  ra1-infisical-pgdata:
  ra1-librechat-images: